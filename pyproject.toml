[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-information"
version = "0.1.0"
description = "External Claude Code Single and Subagents CLI adapters"
requires-python = ">=3.12,<3.14"
# Agent CLIs are installed independently, never imported as project libraries.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["harness*", "benchmarks*", "analysis*"]
exclude = ["*.upstream*", "*.assets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
