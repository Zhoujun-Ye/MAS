[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-info"
version = "0.1.0"
description = "Motivation study: information lost between isolated agent contexts"
requires-python = ">=3.12,<3.14"
# BM25 additionally needs `pyserini==1.2.0` (installed --no-deps), `pyjnius` and
# Java 21; τ²-bench is installed from its pinned checkout. See scripts/server/setup.sh.
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "tokenizers>=0.20",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["mas_info*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
