[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mas-information"
version = "0.1.0"
description = "Leader-subagent orchestration with task-scoped contexts and tool grants"
requires-python = ">=3.12,<3.14"
# Native benchmark dependencies are optional; admission is a separate research gate.
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "jsonschema>=4.18,<5",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["harness*", "benchmarks*", "analysis*"]
exclude = ["*.upstream*", "*.assets*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
